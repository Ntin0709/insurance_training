model: google/gemma-3-4b-it
init_adapter: outputs/gemma3-insurance-sft-lora
train_file: data/insurance/sdg_rules_50k_balanced/dpo_train.jsonl
validation_file: data/insurance/sdg_rules_50k_balanced/dpo_val.jsonl
output_dir: outputs/gemma3-insurance-dpo-lora
epochs: 1.0
batch_size: 1
grad_accum: 16
lr: 0.000005
beta: 0.1
max_length: 4096
max_prompt_length: 2048
