[project]
name = "banking-rl-env"
version = "0.1.0"
description = "Gymnasium-compatible RL environment for banking assistant tool use"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
banking-rl-eval = "banking_rl_env.cli:main"

[project.optional-dependencies]
rl = ["gymnasium>=0.29"]
test = ["pytest>=8"]
llm = [
    "transformers>=4.51",
    "datasets>=2.19",
    "trl>=0.16",
    "peft>=0.11",
    "accelerate>=0.30",
    "bitsandbytes",
]
insurance = ["pypdf>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
